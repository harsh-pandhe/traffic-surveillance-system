name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          # setuptools must be current: on Python 3.12 an old one makes
          # pkg_resources raise "module 'pkgutil' has no attribute 'ImpImporter'",
          # which silently degrades DeepSORT to a fallback tracker.
          python -m pip install --upgrade pip setuptools
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest

      - name: Run regression tests
        # Tests that need trained weights or datasets skip cleanly, so this
        # exercises the logic that can be checked without shipping model files.
        run: pytest tests/ -v --tb=short
